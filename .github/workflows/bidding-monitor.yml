name: 运营商招标信息监控

# 中国移动/联通/电信招标信息抓取 + 飞书推送
# 关键词: 数智化、数据、算力、战略

on:
  # 定时运行：每小时52分运行（8:52-23:52）
  schedule:
    - cron: '52 0-15 * * *'   # 每天8:52-23:52（北京时间）每小时1次
  
  # 测试定时：每5分钟运行一次（仅用于测试）
  # schedule:
  #   - cron: '*/5 * * * *'
  
  # 支持手动触发
  workflow_dispatch:
    inputs:
      bidding_date:
        description: '指定日期 (格式: YYYY-MM-DD，留空使用今天)'
        required: false
        default: ''

permissions:
  contents: write

# GitHub Actions 默认不会并行运行同一 workflow，无需额外配置 concurrency

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装依赖
      run: |
        pip install -r requirements.txt
        playwright install chromium
    
    # 注意：已移除 actions/cache，避免覆盖 pushed_bids_combined.json
    # 去重记录直接存储在仓库中，通过 git 提交保存
    
    - name: 确保推送记录文件存在
      run: |
        if [ ! -f pushed_bids_combined.json ]; then
          echo '{"hashes": [], "urls": []}' > pushed_bids_combined.json
          echo "✅ 创建空的推送记录文件"
        else
          echo "📂 推送记录文件已存在"
          cat pushed_bids_combined.json | head -c 200
          echo ""
        fi
    
    - name: 抓取移动招标信息
      env:
        BIDDING_DATE: ${{ github.event.inputs.bidding_date }}
      run: python fetch_cmcc.py
      continue-on-error: true
    
    - name: 抓取联通招标信息
      env:
        BIDDING_DATE: ${{ github.event.inputs.bidding_date }}
      run: python fetch_unicom.py
      continue-on-error: true
    
    - name: 抓取电信招标信息
      env:
        BIDDING_DATE: ${{ github.event.inputs.bidding_date }}
      run: python fetch_telecom.py
      continue-on-error: true
    
    - name: 整合推送到飞书
      env:
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      run: python push_combined.py
    
    - name: 提交去重记录到仓库
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # 查看文件状态
        echo "📋 检查 pushed_bids_combined.json 状态..."
        ls -la pushed_bids_combined.json || echo "⚠️ 文件不存在"
        
        # 添加到git
        git add pushed_bids_combined.json
        
        # 检查是否有变更
        if git diff --cached --quiet; then
          echo "✅ pushed_bids_combined.json 没有变化，无需提交"
          exit 0
        fi
        
        echo "📝 检测到 pushed_bids_combined.json 有更新，准备提交..."
        git diff --cached --stat
        git commit -m "更新去重记录 $(date +'%Y-%m-%d %H:%M')"
        git push
        echo "✅ 成功提交去重记录到仓库"
      continue-on-error: true